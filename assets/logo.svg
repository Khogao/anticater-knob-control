<?xml version="1.0" encoding="UTF-8"?>
<!--
  Anticater Knob app icon: a knob seen from above, with its indicator slot.
  Original artwork for this project, free to use with it.

  To change the colour, edit the fill of the group with id="logo" below, or pass a colour
  to the generator:   swift assets/make-icons.swift assets/logo.svg FF9124
  The tile behind it is the group with id="tile".
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="tile-gradient" x1="100" y1="100" x2="924" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3C3C3C"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
  </defs>
  <g id="tile">
    <rect x="100" y="100" width="824" height="824" rx="186" ry="186" fill="url(#tile-gradient)"/>
  </g>
  <g id="logo" fill="#FF9124" fill-rule="evenodd">
    <path d="M222.00,512.00 a290.00,290.00 0 1,0 580.00,0 a290.00,290.00 0 1,0 -580.00,0 Z M633.19,485.91 L735.38,426.91 A38.00,38.00 0 0,0 697.38,361.09 L595.19,420.09 A38.00,38.00 0 0,0 633.19,485.91 Z"/>
  </g>
</svg>
